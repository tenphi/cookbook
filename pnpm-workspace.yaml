  - "@astrojs/starlight@0.41.10"
  - "@astrojs/language-server@2.16.15"
  - "@tenphi/tasty@3.4.0"
  - "@tenphi/glaze@2.0.0"
  - typescript@7.0.2
  - sharp@0.35.4
  - "@img/*"
  - "@rolldown/*"
  - "@jridgewell/sourcemap-codec@1.6.0"
  - "@ungap/structured-clone@1.4.0"
  - baseline-browser-mapping@2.11.20
  - devalue@5.9.2
  - electron-to-chromium@1.5.416
  - fastq@1.20.2
  - js-yaml@3.15.2
  - js-yaml@4.3.2
  - magic-string@1.2.3
  - node-gyp@13.0.2
  - node-releases@2.0.54
  - p-map@7.0.7
  - rolldown@1.2.6
  - update-browserslist-db@1.3.2
  - vscode-jsonrpc@9.0.2
  - vscode-languageserver-protocol@3.18.3
  - vscode-languageserver-textdocument@1.0.14
  - vscode-languageserver-types@3.18.3

catalog:
  astro: ^7.2.9
  "@astrojs/starlight": ^0.41.10
  "@tenphi/tasty": 3.4.0
  "@tenphi/glaze": 2.0.0
  typescript: ^7.0.2
  vitest: ^4.1.11
  pagefind: ^1.5.2

allowBuilds:
