name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm build:reference
      - run: node scripts/check-reference-budgets.mjs
      - run: pnpm check:packages
      - run: pnpm check:publishing
      - run: pnpm check:install
  version:
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.5.2
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version:packages
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CI for the release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"
  publish:
    if: github.event_name == 'push' && needs.version.outputs.hasChangesets == 'false'
    needs: [gate, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release
