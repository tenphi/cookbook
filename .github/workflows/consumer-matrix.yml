name: Consumer installations
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  consumer:
    name: ${{ matrix.scenario }}-consumer (${{ matrix.os }}, ${{ matrix.node }}, ${{ matrix.manager }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.19", manager: npm, scenario: packed }
          - { os: ubuntu-latest, node: "24", manager: pnpm, scenario: packed }
          - { os: ubuntu-latest, node: "24", manager: yarn, scenario: packed }
          - { os: ubuntu-latest, node: "26", manager: npm, scenario: packed }
          - { os: macos-latest, node: "24", manager: npm, scenario: packed }
          - {
              os: windows-latest,
              node: "22.22",
              manager: npm,
              scenario: packed,
            }
          - { os: windows-latest, node: "24", manager: pnpm, scenario: packed }
          # npm's generated and packed sites install independently in parallel.
          - {
              os: ubuntu-latest,
              node: "22.19",
              manager: npm,
              scenario: generated,
            }
          - { os: ubuntu-latest, node: "26", manager: npm, scenario: generated }
          - { os: macos-latest, node: "24", manager: npm, scenario: generated }
          - {
              os: windows-latest,
              node: "22.22",
              manager: npm,
              scenario: generated,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: matrix.manager == 'yarn'
        run: npm install --global corepack
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm check:install
        env:
          COOKBOOK_TEST_MANAGER: ${{ matrix.manager }}
          COOKBOOK_TEST_SCENARIO: ${{ matrix.scenario }}
