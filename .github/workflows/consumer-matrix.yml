name: Consumer installations
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packed-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.19", manager: npm }
          - { os: ubuntu-latest, node: "24", manager: pnpm }
          - { os: ubuntu-latest, node: "24", manager: yarn }
          - { os: ubuntu-latest, node: "26", manager: npm }
          - { os: macos-latest, node: "24", manager: npm }
          - { os: windows-latest, node: "22.22", manager: npm }
          - { os: windows-latest, node: "24", manager: pnpm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: matrix.manager == 'yarn'
        run: npm install --global corepack
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm check:install
        env:
          COOKBOOK_TEST_MANAGER: ${{ matrix.manager }}
