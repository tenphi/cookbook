name: Upstream installation canary
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:packages
      - run: pnpm check:install
        env:
          COOKBOOK_TEST_UPSTREAM: "1"
      - run: pnpm check:fonts
      - run: pnpm check:benchmark
        env:
          COOKBOOK_BENCH_PAGES: "1000"
          COOKBOOK_BENCH_BUILD: "1"
